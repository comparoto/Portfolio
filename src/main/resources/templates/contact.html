<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Juliana Comparoto</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="contact-container">

    <section class="contact-header">
        <span class="tag">Contact</span>
        <h1>Let's <span class="name">Connect</span></h1>
        <p class="subtitle">
            I'm always open to new connections, send me a message! :)
        </p>
    </section>

    <div class="contact-grid">
        <div class="contact-info">

            <a href="mailto:julianacomparoto@email.com" class="info-card">
                <div class="card-icon"><i class="fa-solid fa-envelope"></i></div>
                <div class="card-text">
                    <h3>Email</h3>
                    <p>julianacomparoto@email.com</p>
                </div>
            </a>
            <a href="https://wa.me/5581982962848?text=Hi%20Juliana!" target="_blank" class="info-card">
                <div class="card-icon"><i class="fa-brands fa-whatsapp"></i></div>
                <div class="card-text">
                    <h3>WhatsApp</h3>
                    <p>+55 (81) 98296-2848</p>
                </div>
            </a>
            <a href="https://www.linkedin.com/in/juliana-comparoto-" target="_blank" class="info-card">
                <div class="card-icon"><i class="fa-brands fa-linkedin-in"></i></div>
                <div class="card-text">
                    <h3>LinkedIn</h3>
                    <p>in/juliana-comparoto-</p>
                </div>
            </a>

            <a href="https://github.com/comparoto" target="_blank" class="info-card">
                <div class="card-icon"><i class="fa-brands fa-github"></i></div>
                <div class="card-text">
                    <h3>GitHub</h3>
                    <p>github.com/comparoto</p>
                </div>
            </a>

            <div class="info-card">
                <div class="card-icon"><i class="fa-solid fa-location-dot"></i></div>
                <div class="card-text">
                    <h3>Location</h3>
                    <p>Recife -PE | Brazil</p>
                </div>
            </div>

        </div>

        <div class="contact-form-wrapper">
            <h3>Send a Message</h3>

            <form class="contact-form" th:action="@{/contact}" method="POST">

            <div th:if="${success}" class="alert-message alert-success">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert-message alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${error}"></span>
            </div>

                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="youremail@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="What do you wanna talk about?" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell me more" required></textarea>
                </div>

                <button type="submit" class="button glow-button btn-full">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                </button>
            </form>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
